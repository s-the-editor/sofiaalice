<div class="overflow-x-hidden justify-center">
<br><br><br><br>

<div class="center-mobile font-[Times_New_Roman]">
    <h1 class="text-5xl pl-2 pr-2 lg:ml-15 lg:mr-15">Works</h1>
    <br><br>

    <div class="flex flex-row flex-wrap justify-center">
    @for (card of cards; track card.title) {
        <mat-card class="card" appearance="raised">
            <mat-card-content>
                <p class="text-2xl text-left">{{ card.title }}</p>
                <p class="text-xl">{{ card.subtitle }}</p>
                <br>
                <p class="text-lg">{{ card.content }}</p>
            </mat-card-content>
                <div class="card-image-row flex flex-row flex-wrap justify-center">
                    <a [href]="card.link" target="_blank">
                        <img class="image md:h-125 lg:h-140" [src]="card.imageUrl" alt="Photo of {{ card.title }}">
                    </a>
                    @if(card.image2 != null) {
                        <a [href]="card.link" target="_blank">
                            <img class="image md:h-125 lg:h-140" [src]="card.image2" alt="Photo of {{ card.title }}">
                        </a>
                    }
                </div>
                <br>
                
        </mat-card>
    }

    </div>
